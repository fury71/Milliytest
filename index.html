<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Testlar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #080c1a;
    --glass: rgba(255, 255, 255, .07);
    --glass-strong: rgba(255, 255, 255, .12);
    --line: rgba(255, 255, 255, .14);
    --text: #eef1ff;
    --muted: #8e97b8;
    --accent: #8b9cff;
    --amber: #ffc46b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { background: var(--ink); color: var(--text); }
  body {
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; padding: 20px 16px calc(28px + env(safe-area-inset-bottom));
    position: relative; overflow-x: hidden;
  }
  /* Shisha ortidagi yorug' dog'lar */
  body::before, body::after {
    content: ""; position: fixed; z-index: -1; border-radius: 50%; filter: blur(80px); opacity: .55;
  }
  body::before { width: 300px; height: 300px; background: #3b4bd8; top: -90px; right: -80px; }
  body::after  { width: 260px; height: 260px; background: #b4478f; bottom: -80px; left: -90px; opacity: .35; }

  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 26px; font-weight: 800; line-height: 1.15; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 14px; margin: 6px 0 18px; font-weight: 500; }

  .glass {
    background: var(--glass); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    border-radius: 18px;
  }

  .search { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 48px; }
  .search svg { flex: none; opacity: .6; }
  .search input {
    flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text);
    font: 500 15px "Manrope", system-ui, sans-serif;
  }
  .search input::placeholder { color: var(--muted); }
  .search:focus-within { border-color: var(--accent); }

  .tabs { display: flex; gap: 4px; padding: 4px; margin: 16px 0; }
  .tab {
    flex: 1; height: 38px; border: 0; border-radius: 14px; background: none; color: var(--muted);
    font: 700 14px "Manrope", system-ui, sans-serif; cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--glass-strong); color: var(--text); }

  /* Fanlar: har birining o'z rangi bor */
  .cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
  .cat {
    padding: 14px 6px 12px; text-align: center; cursor: pointer; color: var(--text);
    font: 700 13px "Manrope", system-ui, sans-serif; border: 1px solid var(--line);
    transition: transform .15s, border-color .15s;
  }
  .cat:active { transform: scale(.96); }
  .cat .ico {
    width: 46px; height: 46px; margin: 0 auto 8px; border-radius: 14px; font-size: 24px;
    display: grid; place-items: center;
    background: hsl(var(--h) 70% 55% / .22); border: 1px solid hsl(var(--h) 80% 65% / .35);
  }
  .cat small { display: block; margin-top: 2px; color: var(--muted); font-weight: 500; font-size: 11px; }
  .cat[aria-pressed="true"] { border-color: hsl(var(--h) 85% 70%); background: hsl(var(--h) 70% 55% / .16); }

  .list { display: grid; gap: 10px; }
  .test {
    display: flex; align-items: center; gap: 12px; padding: 12px; width: 100%; text-align: left;
    color: var(--text); font-family: inherit; cursor: pointer; border: 1px solid var(--line);
  }
  .test:active { background: var(--glass-strong); }
  .test .ico {
    flex: none; width: 44px; height: 44px; border-radius: 13px; font-size: 22px; display: grid; place-items: center;
    background: hsl(var(--h) 70% 55% / .22);
  }
  .test .body { flex: 1; min-width: 0; }
  .test .t { font-weight: 700; font-size: 15px; line-height: 1.25; }
  .test .m { color: var(--muted); font-size: 12px; margin-top: 3px; font-weight: 500; }
  .chip { flex: none; font-weight: 700; font-size: 12px; padding: 5px 9px; border-radius: 10px; background: var(--glass-strong); }
  .chip.lock { color: var(--amber); }

  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .rank { width: 28px; font-weight: 800; color: var(--muted); }
  .row:nth-child(-n+3) .rank { color: var(--amber); }
  .row .name { flex: 1; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .pts { font-weight: 800; color: var(--accent); }
  .row .pts small { color: var(--muted); font-weight: 500; }

  .empty { text-align: center; color: var(--muted); padding: 36px 12px; font-weight: 500; line-height: 1.5; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="wrap">
  <h1 id="hello">Salom!</h1>
  <p class="sub">Fan tanlang yoki test kodini kiriting</p>

  <label class="glass search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Test nomi yoki kodi (#AB12CD)" autocomplete="off" aria-label="Qidirish">
  </label>

  <div class="glass tabs" role="tablist">
    <button class="tab" role="tab" id="tab-tests" aria-selected="true">Testlar</button>
    <button class="tab" role="tab" id="tab-board" aria-selected="false">Reyting</button>
  </div>

  <section id="view-tests">
    <div class="cats" id="cats"></div>
    <div class="list" id="tests"></div>
  </section>
  <section id="view-board" hidden>
    <div class="glass" id="board"></div>
  </section>
</main>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor?.("#080c1a"); tg.setBackgroundColor?.("#080c1a"); }

const $ = (id) => document.getElementById(id);
const HUES = { "Matematika": 230, "Fizika": 200, "Kimyo": 150, "Biologiya": 120, "Informatika": 265,
               "Ona tili": 20, "Tarix": 40, "Ingliz tili": 350, "Geografiya": 175 };
const ICONS = {};
let botUsername = "", activeCat = "", timer;

// Matnni xavfsiz qo'yish (XSS dan himoya)
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const api = (path) => fetch(path).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });

const name = tg?.initDataUnsafe?.user?.first_name;
$("hello").textContent = name ? `Salom, ${name}!` : "Salom!";

async function loadCats() {
  const cats = await api("/api/categories");
  const box = $("cats"); box.replaceChildren();
  for (const c of cats) {
    ICONS[c.name] = c.icon;
    const b = el("button", "glass cat"); b.type = "button";
    b.style.setProperty("--h", HUES[c.name] ?? 220);
    b.setAttribute("aria-pressed", String(c.name === activeCat));
    b.append(el("div", "ico", c.icon), document.createTextNode(c.name), el("small", null, `${c.count} ta test`));
    b.onclick = () => { activeCat = activeCat === c.name ? "" : c.name; loadCats(); loadTests(); tg?.HapticFeedback?.selectionChanged(); };
    box.append(b);
  }
}

async function loadTests() {
  const params = new URLSearchParams({ category: activeCat, q: $("q").value.trim() });
  const box = $("tests"); box.replaceChildren();
  try {
    const tests = await api("/api/tests?" + params);
    if (!tests.length) { box.append(el("p", "empty", "Test topilmadi. Boshqa fan yoki kod bilan urinib ko'ring.")); return; }
    for (const t of tests) {
      const b = el("button", "glass test"); b.type = "button";
      b.style.setProperty("--h", HUES[t.category] ?? 220);
      const body = el("div", "body");
      body.append(el("div", "t", t.title), el("div", "m", `${t.category} · ${t.questions} savol · ${t.attempts} marta yechilgan`));
      b.append(el("div", "ico", ICONS[t.category] || "📚"), body, el("span", "chip" + (t.is_premium ? " lock" : ""), t.is_premium ? "🔒 Premium" : "#" + t.code));
      b.onclick = () => openTest(t.code);
      box.append(b);
    }
  } catch { box.append(el("p", "empty", "Ma'lumotni yuklab bo'lmadi. Internetni tekshirib, qayta oching.")); }
}

async function loadBoard() {
  const box = $("board"); box.replaceChildren();
  try {
    const rows = await api("/api/leaderboard");
    if (!rows.length) { box.append(el("p", "empty", "Hali natijalar yo'q. Birinchi test yeching va reytingni boshlang!")); return; }
    rows.forEach((r, i) => {
      const row = el("div", "row");
      const pts = el("span", "pts", `${r.correct} `); pts.append(el("small", null, `to'g'ri · ${r.tests} test`));
      row.append(el("span", "rank", String(i + 1)), el("span", "name", r.name), pts);
      box.append(row);
    });
  } catch { box.append(el("p", "empty", "Reytingni yuklab bo'lmadi.")); }
}

// Testni botda ochish: /start test_KOD deep link
function openTest(code) {
  const link = `https://t.me/${botUsername}?start=test_${code}`;
  if (tg) { tg.openTelegramLink(link); tg.close(); } else { window.open(link, "_blank"); }
}

function selectTab(tab) {
  const tests = tab === "tests";
  $("tab-tests").setAttribute("aria-selected", tests); $("tab-board").setAttribute("aria-selected", !tests);
  $("view-tests").hidden = !tests; $("view-board").hidden = tests;
  $("q").closest(".search").hidden = !tests;
  if (!tests) loadBoard();
}
$("tab-tests").onclick = () => selectTab("tests");
$("tab-board").onclick = () => selectTab("board");
$("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(loadTests, 250); });

(async () => {
  try { botUsername = (await api("/api/config")).bot_username; } catch {}
  await loadCats(); loadTests();
})();
</script>
</body>
</html>
