<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Milliy Testlar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0f1830; --gold:#f2b01e; --gold2:#b87a0a; --gold-d:#3a1b06;
  --glass:rgba(255,255,255,.055); --glass-b:rgba(255,255,255,.11);
  --tx:#f3f1ec; --mut:#9a978f; --ok:#35c46a; --bad:#e5484d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;min-height:100%;overscroll-behavior:none}
body{padding-bottom:110px;background:linear-gradient(180deg,#0d1630 0%,#111b36 100%) fixed}
.glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07)}
header{display:flex;align-items:center;justify-content:center;gap:12px;padding:18px 16px 10px;padding-top:calc(18px + env(safe-area-inset-top))}
header .logo-t{line-height:1;text-align:left}
header .t{font-weight:900;font-size:27px;letter-spacing:2px;background:linear-gradient(180deg,#ffd45a,#d9941a);-webkit-background-clip:text;background-clip:text;color:transparent}
header .t2{font-weight:700;font-size:12px;letter-spacing:9px;color:#d9a73c;margin-top:5px;padding-left:2px}
header{position:relative}
.snd{position:absolute;right:16px;top:calc(22px + env(safe-area-inset-top));width:38px;height:38px;border-radius:50%;border:1px solid var(--glass-b);background:var(--glass);color:#fff;font-size:16px;cursor:pointer}
header .bird{width:92px;height:46px;filter:drop-shadow(0 4px 12px rgba(242,176,30,.35))}
.wrap{padding:6px 16px 0;max-width:640px;margin:0 auto}
.view{display:none;animation:fi .25s ease}.view.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:22px;font-weight:700;margin:22px 4px 14px}
.profile{border-radius:26px;padding:20px;margin-top:8px}
.prow{display:flex;align-items:center;gap:14px}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:24px;color:#fff;background:linear-gradient(145deg,#f7b733,#c27c0c);border:2px solid rgba(255,214,120,.55);flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.pname{font-size:20px;font-weight:700}
.badge{margin-left:auto;font-size:11px;letter-spacing:1.5px;font-weight:700;color:#ffd978;border:1px solid rgba(242,176,30,.5);border-radius:999px;padding:6px 10px;background:rgba(242,176,30,.08)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.st{padding:12px 10px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);text-align:center}
.st small{display:block;font-size:11px;letter-spacing:1.2px;color:var(--mut);text-transform:uppercase;margin-bottom:5px}
.st b{font-size:24px;font-weight:800;color:#fff}.st b i{font-style:normal;color:var(--gold)}
.btn{width:100%;border:0;border-radius:18px;padding:16px;font-size:17px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(90deg,#f7b500 0%,#b87a0a 55%,#3a1708 100%);margin-top:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:scale(.985)}
.btn.sec{background:var(--glass);border:1px solid var(--glass-b);color:var(--tx)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border-radius:22px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:transform .15s}
.card:active{transform:scale(.97)}
.ic{width:58px;height:58px;border-radius:15px;display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 6px 14px rgba(0,0,0,.5);overflow:hidden;flex:none}
.ic svg{width:34px;height:34px}.ic svg.full{width:100%;height:100%}
.card .n{font-weight:700;font-size:15px;line-height:1.2}
.card .d{font-size:11.5px;color:var(--mut);line-height:1.35}
.row{display:flex;align-items:center;gap:14px;border-radius:20px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.row .ic{width:48px;height:48px;border-radius:13px}.row .ic svg{width:28px;height:28px}
.row .m{flex:1;min-width:0}.row .n{font-weight:700;font-size:15.5px}.row .d{font-size:12px;color:var(--mut);margin-top:3px}
.chev{color:var(--mut);font-size:22px}
.empty{text-align:center;color:var(--mut);padding:50px 20px}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--mut)}
.hs{font-weight:800;font-size:18px}
/* nav */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(92vw,560px);border-radius:32px;display:flex;justify-content:space-around;padding:10px 6px;z-index:20;border:1px solid rgba(242,176,30,.45);background:rgba(14,22,46,.82)}
nav button{flex:1;background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:6px 0;cursor:pointer}
nav button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gold)}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:30;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{width:min(100%,600px);border-radius:28px 28px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));background:rgba(16,24,48,.96);animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .hd{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.sheet .hd .ic{width:52px;height:52px}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:15px 16px;border-radius:16px;margin-top:10px;border:1px solid var(--glass-b);background:var(--glass);color:var(--tx);font-size:15.5px;font-weight:600;cursor:pointer}
.opt small{color:var(--mut);font-weight:500;font-size:12px;display:block;margin-top:3px}
.opt.gold{background:linear-gradient(90deg,rgba(247,181,0,.22),rgba(58,23,8,.35));border-color:rgba(242,176,30,.5)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px}
/* quiz */
#quiz{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top)) 16px 30px}
#quiz.on{display:block}
.qtop{display:flex;align-items:center;gap:12px;max-width:640px;margin:0 auto}
.x{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:20px}
.bar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ffdf7a);transition:width .3s}
.qb{max-width:640px;margin:22px auto 0}
.qmeta{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin-bottom:12px}
.qt{font-size:20px;font-weight:700;line-height:1.4;padding:20px;border-radius:22px;margin-bottom:16px}
.ans{display:block;width:100%;text-align:left;padding:16px;border-radius:16px;margin-bottom:10px;border:1px solid var(--glass-b);background:var(--glass);color:var(--tx);font-size:16px;cursor:pointer}
.ans.ok{background:rgba(53,196,106,.18);border-color:var(--ok)}
.ans.bad{background:rgba(229,72,77,.18);border-color:var(--bad)}
.ans:disabled{cursor:default}
.res{max-width:640px;margin:30px auto;text-align:center}
.ring{width:170px;height:170px;border-radius:50%;margin:20px auto;display:grid;place-items:center;font-size:40px;font-weight:800}
.ring span{width:140px;height:140px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(30,30,33,.95);border:1px solid var(--glass-b);padding:10px 16px;border-radius:14px;font-size:13px;z-index:60;display:none}
</style>
</head>
<body>

<header>
  <svg class="bird" viewBox="330 185 880 435" aria-label="Milliy Testlar logotipi">
    <defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6c850"/><stop offset="1" stop-color="#b57a14"/></linearGradient></defs>
    <g fill="url(#gg)">
      <polygon points="341,196 670,286 413,287"/>
      <polygon points="426,302 686,302 497,373"/>
      <polygon points="512,385 706,314 588,430"/>
      <polygon points="1195,196 866,286 1123,287"/>
      <polygon points="1110,302 850,302 1039,373"/>
      <polygon points="1024,385 830,314 948,430"/>
      <path d="M704 314 L868 448 L768 607 L666 444 L730 392 L752 411 L709 446 L768 519 L825 451 L699 348 Z"/>
      <path d="M833 314 L836 348 L803 378 L780 358 Z"/>
    </g>
  </svg>
  <div class="logo-t"><div class="t">MILLIY</div><div class="t2">TESTLAR</div></div>

</header>

<div class="wrap">
  <!-- BOSH SAHIFA -->
  <section class="view on" id="v-home">
    <div class="profile glass">
      <div class="prow">
        <div class="av" id="av">F</div>
        <div class="pname" id="uname">Foydalanuvchi</div>
        <div class="badge">FAOL</div>
      </div>
      <div class="stats">
        <div class="st"><small>Ballar</small><b id="s-ball">0</b></div>
        <div class="st"><small>Ochkolar</small><b id="s-och">0</b></div>
        <div class="st"><small>Testlar</small><b id="s-test">0</b></div>
      </div>
      <button class="btn" onclick="go('tests')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg>
        Test ishlash
      </button>
    </div>
    <h2>Fanlar</h2>
    <div class="grid" id="grid"></div>
  </section>

  <!-- TESTLAR -->
  <section class="view" id="v-tests">
    <h2>Testlar</h2>
    <div id="tlist"></div>
  </section>

  <!-- TESTLAR TARIXI -->
  <section class="view" id="v-hist">
    <h2>Testlar tarixi</h2>
    <div id="hlist"></div>
  </section>

  <!-- PROFIL -->
  <section class="view" id="v-prof">
    <div class="profile glass" style="margin-top:20px">
      <div class="prow">
        <div class="av" id="av2">F</div>
        <div><div class="pname" id="uname2">Foydalanuvchi</div><div style="color:var(--mut);font-size:13px;margin-top:4px" id="uid"></div></div>
      </div>
      <div class="stats">
        <div class="st"><small>Ballar</small><b id="p-ball">0</b></div>
        <div class="st"><small>Ochkolar</small><b id="p-och">0</b></div>
        <div class="st"><small>Testlar</small><b id="p-test">0</b></div>
      </div>
      <div class="stats" style="grid-template-columns:1fr 1fr">
        <div class="st"><small>To'g'ri javoblar</small><b id="p-ok">0</b></div>
        <div class="st"><small>O'rtacha natija</small><b id="p-avg">0%</b></div>
      </div>
    </div>
    <p style="color:var(--mut);font-size:13px;margin:16px 6px;line-height:1.5">Ball = to'g'ri javoblar soni. Ochko: oson +1, o'rtacha +2, qiyin +3 (har bir to'g'ri javob uchun).</p>
    <button class="btn sec" onclick="resetAll()">Natijalarni tozalash</button>
  </section>
</div>

<nav class="glass">
  <button data-v="home" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Bosh sahifa</button>
  <button data-v="tests"><svg viewBox="0 0 24 24"><path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1z"/><rect x="5" y="6" width="14" height="15" rx="2.5"/><path d="M9 12l2 2 4-4M9 17h6"/></svg>Testlar</button>
  <button data-v="hist"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Testlar tarixi</button>
  <button data-v="prof"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>Profil</button>
</nav>

<!-- Fan tanlash oynasi -->
<div class="ov" id="ov" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<!-- Test oynasi -->
<div id="quiz"></div>
<div class="toast" id="toast"></div>

/* Matematika: 30 tadan savol dasturiy yaratiladi (doimiy, takrorlanmas) */
function genMath(){
  let seed=2026; const r=()=>(seed=(seed*1664525+1013904223)%4294967296)/4294967296;
  const ri=(a,b)=>a+Math.floor(r()*(b-a+1));
  const mk=(q,ans)=>{
    const set=new Set([ans]); const offs=[1,-1,2,-2,3,-3,5,-5,10,-10];
    while(set.size<4){set.add(ans+offs[ri(0,offs.length-1)]*(Math.abs(ans)>50?ri(1,3):1))}
    const opts=[...set]; for(let i=opts.length-1;i>0;i--){const j=ri(0,i);[opts[i],opts[j]]=[opts[j],opts[i]]}
    return [q,opts.map(String),opts.indexOf(ans)];
  };
  const out={e:[],m:[],h:[]}, seen=new Set();
  const fill=(k,fn)=>{let g=0;while(out[k].length<POOL&&g++<500){const x=fn(g);if(!seen.has(x[0])){seen.add(x[0]);out[k].push(mk(x[0],x[1]))}}};
  fill("e",g=>{const t=g%4,a=ri(11,60),b=ri(2,40);
    if(t==0)return[`${a} + ${b} = ?`,a+b]; if(t==1)return[`${a+b} − ${b} = ?`,a];
    if(t==2){const x=ri(3,12),y=ri(3,12);return[`${x} × ${y} = ?`,x*y]} const y=ri(3,12),z=ri(3,15);return[`${y*z} ÷ ${y} = ?`,z]});
  fill("m",g=>{const t=g%4;
    if(t==0){const x=ri(2,15),a=ri(2,9),b=ri(1,20);return[`${a}x + ${b} = ${a*x+b} bo'lsa, x = ?`,x]}
    if(t==1){const p=[10,20,25,50][ri(0,3)],n=ri(2,20)*20;return[`${n} ning ${p}% i nechaga teng?`,n*p/100]}
    if(t==2){const a=ri(11,25);return[`${a}² = ?`,a*a]} const a=ri(2,9),b=ri(2,9);return[`${a}·${b}² + ${a} = ?`,a*b*b+a]});
  fill("h",g=>{const t=g%4;
    if(t==0){const p=ri(1,9),q=ri(1,9);return[`x² − ${p+q}x + ${p*q} = 0 tenglama ildizlari ko'paytmasi?`,p*q]}
    if(t==1){const n=ri(3,5),x=ri(2,4);return[`f(x) = x${["","","²","³","⁴","⁵"][n]} bo'lsa, f′(${x}) = ?`,n*Math.pow(x,n-1)]}
    if(t==2){const n=ri(5,14);return[`${n} ta elementdan 2 tasini tanlash usullari soni C(${n},2) = ?`,n*(n-1)/2]}
    const a=ri(1,9),d=ri(2,7),n=ri(8,20);return[`Arifmetik progressiya: a₁=${a}, d=${d}. a${n} = ?`,a+(n-1)*d]});
  return out;
}

function stats(){
  const h=load(); let ball=0,och=0,ok=0,tot=0;
  h.forEach(x=>{ball+=x.c;och+=x.p;ok+=x.c;tot+=x.t});
  const avg=tot?Math.round(ok/tot*100):0;
  $("s-ball").textContent=ball; $("s-och").innerHTML=och; $("s-test").textContent=h.length;
  $("p-ball").textContent=ball; $("p-och").textContent=och; $("p-test").textContent=h.length;
  $("p-ok").textContent=ok; $("p-avg").textContent=avg+"%";
}

function renderHist(){
  const h=load().slice().reverse();
  if(!h.length){$("hlist").innerHTML='<div class="empty">Hali test ishlanmagan.<br>Fan tanlab, birinchi testingizni boshlang.</div>';return}
  $("hlist").innerHTML=h.map(x=>{const s=sub(x.s);const pc=Math.round(x.c/x.t*100);
    return `<div class="row glass" style="cursor:default">${icon(s)}<div class="m"><div class="n">${s.name}</div><div class="d">${x.m} · ${x.d}</div></div><div style="text-align:right"><div class="hs" style="color:${pc>=70?"var(--ok)":pc>=40?"var(--gold)":"var(--bad)"}">${pc}%</div><div class="d">${x.c}/${x.t} · +${x.p} ochko</div></div></div>`}).join("");

function go(v){
  document.querySelectorAll(".view").forEach(e=>e.classList.toggle("on",e.id==="v-"+v));

function openSheet(id){
  const s=sub(id), b=B[id];
  let h=`<div class="hd">${icon(s)}<div><div style="font-size:19px;font-weight:700">${s.name}</div><div class="d" style="color:var(--mut);font-size:12px;margin-top:3px">Test turini o'zingiz tanlang</div></div></div>`;

  h+=`<button class="opt gold" onclick="start('${id}','mix')"><div>Aralash test<small>${DESC}</small></div><span>${mixN} ta ›</span></button>`;

}

/* ================== TEST ================== */
let Q=null;
function start(id,mode){
  const b=B[id]; let list=[];
  if(mode==="mix"){["e","m","h"].forEach(k=>shuffle(b[k]).slice(0,COMP[k]).forEach(q=>list.push({q,k})))}
  else list=shuffle(b[mode]).slice(0,POOL).map(q=>({q,k:mode}));
  if(!list.length){toast("Bu bo'limda savollar yo'q");return}
  list=list.map(x=>{const idx=shuffle(x.q[1].map((t,i)=>i));return{k:x.k,t:x.q[0],o:idx.map(i=>x.q[1][i]),a:idx.indexOf(x.q[2])}});
  Q={id,mode,list,i:0,c:0,p:0,done:false};
  closeSheet(); $("quiz").classList.add("on"); showQ();
}
function showQ(){
  const x=Q.list[Q.i], n=Q.list.length;
  $("quiz").innerHTML=`<div class="qtop"><div class="x glass" onclick="quit()">✕</div><div class="bar"><i style="width:${Q.i/n*100}%"></i></div><span class="pill">${Q.i+1}/${n}</span></div>
  <div class="qb"><div class="qmeta"><span>${sub(Q.id).name}</span><span style="color:${LV[x.k][1]}">● ${LV[x.k][0]}</span></div>
  <div class="qt glass">${x.t}</div>
  <div id="ans">${x.o.map((t,i)=>`<button class="ans" onclick="pick(${i})">${t}</button>`).join("")}</div>
  <button class="btn" id="nx" style="display:none" onclick="nextQ()">${Q.i===n-1?"Natijani ko'rish":"Keyingisi"}</button></div>`;
  window.scrollTo(0,0);
}
function pick(i){
  const x=Q.list[Q.i], bs=document.querySelectorAll(".ans");
  bs.forEach((b,j)=>{b.disabled=true;if(j===x.a)b.classList.add("ok");else if(j===i)b.classList.add("bad")});
  if(i===x.a){Q.c++;Q.p+=W[x.k];sfx.ok()}else sfx.bad();
  $("nx").style.display="flex";
}
function nextQ(){Q.i++; if(Q.i>=Q.list.length)finish(); else showQ()}
function quit(){ if(confirm("Testni tugatmasdan chiqasizmi? Natija saqlanmaydi.")){$("quiz").classList.remove("on");Q=null} }
function finish(){
  const n=Q.list.length, pc=Math.round(Q.c/n*100);
  const d=new Date(), ds=d.toLocaleDateString("uz-UZ")+" "+d.toLocaleTimeString("uz-UZ",{hour:"2-digit",minute:"2-digit"});
  const mname=Q.mode==="mix"?"Aralash":LV[Q.mode][0];
  const h=load(); h.push({s:Q.id,m:mname,c:Q.c,t:n,p:Q.p,d:ds}); save(h);
  sfx.done(); const col=pc>=70?"#35c46a":pc>=40?"#f2b01e":"#e5484d";
  $("quiz").innerHTML=`<div class="res"><div style="color:var(--mut)">${sub(Q.id).name} · ${mname}</div>
  <div class="ring" style="background:conic-gradient(${col} ${pc*3.6}deg,rgba(255,255,255,.1) 0)"><span>${pc}%</span></div>
  <div style="font-size:20px;font-weight:700">${Q.c} / ${n} to'g'ri</div>
  <div style="color:var(--gold);margin-top:8px;font-weight:600">+${Q.p} ochko · +${Q.c} ball</div>
  <button class="btn" onclick="start('${Q.id}','${Q.mode}')">Qayta ishlash</button>
  <button class="btn sec" onclick="closeQuiz()">Yopish</button></div>`;
}
function closeQuiz(){$("quiz").classList.remove("on");Q=null;stats();renderHist()}

/* ================== SFX (yengil ovozlar) ================== */
let AC=null, SND=true;
try{SND=localStorage.getItem("mt_snd")!=="0"}catch(e){}
function tone(f,d,type,v,delay){
  if(!SND)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended")AC.resume();
    const t=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
    o.type=type||"sine"; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v||0.05,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.02);
  }catch(e){}
}
const sfx={
  tap:()=>tone(620,.06,"triangle",.035),
  ok:()=>{tone(660,.12,"sine",.05);tone(880,.18,"sine",.05,.09)},
  bad:()=>{tone(220,.18,"triangle",.05);tone(165,.25,"triangle",.05,.12)},
  done:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.22,"sine",.05,i*.11))
};
function toggleSnd(){SND=!SND;try{localStorage.setItem("mt_snd",SND?"1":"0")}catch(e){} $("snd").textContent=SND?"🔊":"🔇"; if(SND)sfx.tap()}
document.addEventListener("pointerdown",e=>{ if(e.target.closest(".ans")||e.target.closest("#snd"))return; if(e.target.closest("button,.card,.row,.x"))sfx.tap() });
